<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hua2307 - Personal Page</title>
    <!-- 引入 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        .btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }
        #joke-container {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 5px solid #3498db;
            border-radius: 6px;
            text-align: left;
            min-height: 80px;
        }
        .setup {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .punchline {
            font-size: 1.05em;
            color: #e74c3c;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, 我是 Hua2307 👋</h1>
        <p>歡迎來到我建立的個人網站</p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

        <h3>💻 jQuery Ajax 隨機程式笑話 API</h3>
        <p>點擊下方按鈕，會透過 jQuery Ajax 向公開 API 請求笑話 JSON 資料：</p>
        
        <button id="get-joke-btn" class="btn">來個工程師笑話！</button>

        <div id="joke-container">
            <div id="joke-setup" class="setup">點擊按鈕載入笑話...</div>
            <div id="joke-punchline" class="punchline"></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#get-joke-btn').click(function() {
                $('#joke-setup').text('載入笑話中...');
                $('#joke-punchline').text('');

                // 發送 jQuery Ajax 請求
                $.ajax({
                    url: 'https://official-joke-api.appspot.com/jokes/programming/random',
                    type: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        // 回傳的是陣列，取第一個笑話物件
                        var joke = data[0];
                        $('#joke-setup').text('Q: ' + joke.setup);
                        
                        // 稍微延遲 0.4 秒顯示笑點，增加趣味感
                        setTimeout(function() {
                            $('#joke-punchline').text('A: ' + joke.punchline);
                        }, 400);
                    },
                    error: function() {
                        // 備用笑話以防 API 異常
                        $('#joke-setup').text('Q: Why do Java programmers have to wear glasses?');
                        $('#joke-punchline').text('A: Because they don\'t C#!');
                    }
                });
            });
        });
    </script>
</body>
</html>
