        $(document).ready(function() {$('#get-joke-btn').click(function() {
                $('#joke-setup').text('載入笑話中...');
                $('#joke-punchline').text('');
                $('#joke-extra').empty();

                // 使用 jQuery 非同步處理資料呈現
                setTimeout(function() {
                    const randomIndex = Math.floor(Math.random() * allJokes.length);
                    const joke = allJokes[randomIndex];

                    $('#joke-setup').text(joke.setup);
                    
                    setTimeout(function() {
                        $('#joke-punchline').text(joke.punchline);

                        // 如果笑話含有影片連結則自動動態附上
                        if (joke.url) {
                            const linkHtml = `<a class="joke-link" href="${joke.url}" target="_blank">${joke.linkText}</a>`;
                            $('#joke-extra').html(linkHtml);
                        }
                    }, 350);
                }, 150);
            });
        });
    </script>
